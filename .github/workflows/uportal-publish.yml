name: Publish UPORTAL Runtime

on:
  push:
    branches: [main]
    paths:
      - "deploy/uportal/**"
      - ".github/workflows/uportal-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish pinned evidentiary UPORTAL
        uses: docker/build-push-action@v6
        with:
          context: deploy/uportal
          file: deploy/uportal/Dockerfile
          push: true
          tags: |
            ghcr.io/glaciereq/gmail-mcp-server-uportal:0.2.54
            ghcr.io/glaciereq/gmail-mcp-server-uportal:live
          build-args: |
            UPORTAL_DOMAIN=coated-invision-disk-stuck.trycloudflare.com
            UPORTAL_BASE_URL=https://coated-invision-disk-stuck.trycloudflare.com
            UPORTAL_PLUGIN_DEFAULT_BASE_URL=https://coated-invision-disk-stuck.trycloudflare.com
