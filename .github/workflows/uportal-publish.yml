name: Publish UPORTAL Runtime

on:
  push:
    branches: [main]
    paths:
      - "deploy/uportal/**"
      - ".github/workflows/uportal-publish.yml"
  workflow_dispatch:
    inputs:
      uportal_base_url:
        description: "Optional final HTTPS base URL for a domain-bound admin/plugin build"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve publication profile
        id: config
        shell: bash
        env:
          REQUESTED_BASE_URL: ${{ inputs.uportal_base_url || '' }}
        run: |
          set -euo pipefail
          image="ghcr.io/glaciereq/gmail-mcp-server-uportal"
          requested="${REQUESTED_BASE_URL%/}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${requested}" ]]; then
            if [[ "${requested}" != https://* ]]; then
              echo "::error::uportal_base_url must use https://"
              exit 1
            fi
            authority="${requested#https://}"
            if [[ "${authority}" == */* || -z "${authority}" ]]; then
              echo "::error::uportal_base_url must be a bare HTTPS origin without a path"
              exit 1
            fi
            base_url="${requested}"
            profile="domain-bound"
            tags="${image}:domain-${GITHUB_RUN_ID}"$'\n'"${image}:sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}"
          else
            base_url="https://localhost"
            profile="portable"
            tags="${image}:0.2.54"$'\n'"${image}:live"$'\n'"${image}:sha-${GITHUB_SHA}"
          fi

          echo "base_url=${base_url}" >> "${GITHUB_OUTPUT}"
          echo "profile=${profile}" >> "${GITHUB_OUTPUT}"
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and publish pinned evidentiary UPORTAL
        uses: docker/build-push-action@v6
        with:
          context: deploy/uportal
          file: deploy/uportal/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: ${{ steps.config.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/GlacierEQ/gmail-mcp-server
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.2.54
            io.glaciereq.uportal.profile=${{ steps.config.outputs.profile }}
          build-args: |
            UPORTAL_BASE_URL=${{ steps.config.outputs.base_url }}
            UPORTAL_PLUGIN_DEFAULT_BASE_URL=${{ steps.config.outputs.base_url }}
