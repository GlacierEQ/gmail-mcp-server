name: Gmail MCP CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full email operations test suite
        run: npm test

  uportal-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate hardening patch syntax
        run: sh -n deploy/uportal/patch-upstream.sh
      - name: Build pinned evidentiary UPORTAL image
        run: >-
          docker build
          --file deploy/uportal/Dockerfile
          --build-arg UPORTAL_DOMAIN=tracker.example.test
          --build-arg UPORTAL_BASE_URL=https://tracker.example.test
          --tag glaciereq-uportal:ci
          deploy/uportal
      - name: Verify image hardening and runtime contract
        run: >-
          docker run --rm --entrypoint /bin/bash glaciereq-uportal:ci -lc
          "grep -q 'GlacierEQ evidence-minimal profile' /opt/uportal/runtime/scripts/uportal-track-event.sh &&
          grep -q \"return 'nouid'\" /opt/uportal/runtime/njs/portal.js &&
          grep -q 'UPORTAL_FIRST_USER_TOKEN' /usr/local/bin/uportal-container-entrypoint &&
          ! grep -q 'echo \"first user token:' /usr/local/bin/uportal-container-entrypoint"
